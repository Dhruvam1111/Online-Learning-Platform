# ──────────────────────────────────────────────────────────────────────────────
# Nginx configuration for the Focotech React SPA
#
# Responsibilities:
#   1. Serve the Vite-built static files from /usr/share/nginx/html
#   2. Forward all /api/* requests to the Spring Boot backend container
#   3. Handle hash-based SPA routing (no path-based 404 issues)
#   4. Set production-appropriate cache headers on static assets
# ──────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    # Root directory where Vite places the production build
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── API reverse proxy ────────────────────────────────────────────────────
    # All requests to /api/* are forwarded to the Spring Boot backend.
    # BACKEND_URL defaults to http://olp-backend:8080 when running in
    # Docker Compose, or can be overridden at runtime (see README).
    #
    # NOTE: This block is evaluated by Nginx at startup using the
    # BACKEND_URL environment variable injected via the entrypoint
    # template (envsubst).  The Nginx official image supports this
    # automatically for files placed in /etc/nginx/templates/.
    # We keep the config simple here: the Docker run command or
    # docker-compose.yml should set BACKEND_URL appropriately.
    location /api/ {
        proxy_pass ${BACKEND_URL}/api/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable proxy buffering for streaming / SSE responses
        proxy_buffering    off;
        proxy_read_timeout 60s;
    }

    # ── Static asset caching ─────────────────────────────────────────────────
    # Vite fingerprints all JS/CSS chunks with content hashes.
    # We can safely cache them for 1 year.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA routing ──────────────────────────────────────────────────────────
    # This app uses HASH-based routing (#signin, #dashboard).
    # Hash fragments are never sent to the server, so every URL
    # request correctly resolves to index.html without causing 404s.
    #
    # The try_files fallback is included as a safety net for any
    # direct path-based navigation that may be added in the future.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Error pages ──────────────────────────────────────────────────────────
    error_page 404 /index.html;
}

