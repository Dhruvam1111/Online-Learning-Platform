# TLS termination example; certificates are supplied by deployment secret storage.
server {
    listen 80;
    server_name olp.example.invalid;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name olp.example.invalid;
    ssl_certificate /run/secrets/olp-tls/fullchain.pem;
    ssl_certificate_key /run/secrets/olp-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location /actuator/health { proxy_pass http://backend:8080; }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / { proxy_pass http://frontend:80; }
}
