# ==============================================================================
# Online Learning Platform - Test Configuration (CI & Local Unit Tests)
# ==============================================================================

# Database Configuration (Defaults to local/CI PostgreSQL service container)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/olp_test}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration (Safe test secret for testing only)
jwt.secret=${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWZvci1jaS1waXBlbGluZS12YWxpZGF0aW9uMTIzNDU2}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Server
server.port=8081
logging.level.org.springframework.security=WARN

