# ============================================================
# Development Profile (Standalone without Docker/PostgreSQL)
# ============================================================
spring.application.name=online-learning-backend-dev

# H2 In-Memory Database (PostgreSQL mode)
spring.datasource.url=jdbc:h2:mem:online_learning;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates/updates tables automatically in dev mode
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Google OAuth Client
app.google.client-id=online-learning-dev-client-id.apps.googleusercontent.com

# CORS Configuration
app.cors.allowed-origins=*
