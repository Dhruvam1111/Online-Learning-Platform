# Set true only after the reviewed schema migration.
payments.jobs.enabled=true
payments.jobs.notice-delay-ms=60000
payments.expiry-scan-ms=60000
payments.jobs.reconciliation-cron=0 0 1 * * *
# Supply a shared 32+ byte secret securely through PAYMENTS_WEBHOOK_SECRET.
payments.webhook-secret=${PAYMENTS_WEBHOOK_SECRET}
spring.jpa.hibernate.ddl-auto=validate
